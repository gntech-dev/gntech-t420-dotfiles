# GNTECH T420 - Low Power Picom
# Intel HD Graphics 3000 / i3 X11

backend = "xrender";
vsync = false;
use-damage = true;

# Lightweight shadows
shadow = true;
shadow-radius = 6;
shadow-opacity = 0.28;
shadow-offset-x = -3;
shadow-offset-y = -3;

shadow-exclude = [
    "window_type = 'dock'",
    "window_type = 'desktop'",
    "_GTK_FRAME_EXTENTS@"
];

# Preserve application opacity
inactive-opacity = 1.0;
active-opacity = 1.0;
frame-opacity = 1.0;
detect-client-opacity = true;

# Disable unnecessary effects
fading = false;
blur-background = false;

# Avoid fullscreen transition artifacts
unredir-if-possible = false;
