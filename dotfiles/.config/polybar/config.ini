[colors]
background = #10141c
foreground = #d6deeb
cyan = #00d9ff
purple = #c792ea
green = #c3e88d
yellow = #ffcb6b
red = #ff5370
muted = #8994a8

[bar/gntech]
width = 100%
height = 30
radius = 0
background = ${colors.background}
foreground = ${colors.foreground}

line-size = 2
border-size = 0
padding-left = 2
padding-right = 2
module-margin = 2

font-0 = JetBrainsMono Nerd Font:size=10;2

modules-left = launcher screenshot clipboard i3
modules-center = xwindow
modules-right = cpu cpu-temp memory filesystem network pulseaudio battery date tray power
enable-ipc = true
override-redirect = false

cursor-click = pointer
cursor-scroll = ns-resize

[module/launcher]
type = custom/text
format = " 󰣇 "
format-foreground = #10141c
format-background = #00d9ff
format-padding = 1
click-left = ~/.local/bin/gntech-launcher

[module/i3]
type = internal/i3
pin-workspaces = true
show-urgent = true
strip-wsnumbers = false
index-sort = true

label-focused = %index%
label-focused-foreground = ${colors.cyan}
label-focused-underline = ${colors.cyan}
label-focused-padding = 2

label-unfocused = %index%
label-unfocused-foreground = ${colors.muted}
label-unfocused-padding = 2

label-visible = %index%
label-visible-foreground = ${colors.foreground}
label-visible-padding = 2

label-urgent = %index%
label-urgent-foreground = ${colors.red}
label-urgent-padding = 2

[module/xwindow]
type = internal/xwindow
label = %title:0:45:...%
label-foreground = ${colors.muted}

[module/cpu]
type = internal/cpu
interval = 3
label = %{A1:~/.local/bin/gntech-bar-action cpu:}󰍛 %percentage%%%{A}
label-foreground = ${colors.cyan}
[module/memory]
type = internal/memory
interval = 5
label = %{A1:~/.local/bin/gntech-bar-action memory:}󰘚 %percentage_used%%%{A}
label-foreground = ${colors.purple}
[module/filesystem]
type = internal/fs
interval = 60
mount-0 = /
label-mounted = %{A1:~/.local/bin/gntech-bar-action disk:}󰋊 %percentage_used%%%{A}
label-mounted-foreground = ${colors.muted}
[module/network]
type = internal/network
interface-type = wireless
interval = 5
label-connected = %{A1:~/.local/bin/gntech-bar-action wifi:}󰖩 %signal%%%{A}
label-connected-foreground = ${colors.green}
label-disconnected = %{A1:~/.local/bin/gntech-bar-action wifi:}󰖪%{A}
label-disconnected-foreground = ${colors.red}
[module/pulseaudio]
type = internal/pulseaudio
use-ui-max = false
interval = 5
label-volume = %{A1:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle:}󰕾 %percentage%%%{A}
label-volume-foreground = ${colors.cyan}
label-muted = %{A1:wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle:}󰖁%{A}
label-muted-foreground = ${colors.red}

scroll-up = #pulseaudio.inc
scroll-down = #pulseaudio.dec
[module/battery]
type = internal/battery

battery = BAT0
adapter = AC
full-at = 100
low-at = 15
poll-interval = 5

format-charging = %{A1:~/.local/bin/gntech-bar-action battery:}<animation-charging> <label-charging>%{A}
format-charging-foreground = #00d9ff

format-discharging = %{A1:~/.local/bin/gntech-bar-action battery:}<ramp-capacity> <label-discharging>%{A}
format-discharging-foreground = #ffcb6b

format-full = %{A1:~/.local/bin/gntech-bar-action battery:}<label-full>%{A}
format-full-foreground = #c3e88d

format-low = %{A1:~/.local/bin/gntech-bar-action battery:}<animation-low> <label-low>%{A}
format-low-foreground = #ff5370

label-charging = %percentage%%
label-discharging = %percentage%%
label-full = 󰁹 %percentage%%
label-low = %percentage%%

ramp-capacity-0 = 󰁺
ramp-capacity-1 = 󰁻
ramp-capacity-2 = 󰁼
ramp-capacity-3 = 󰁽
ramp-capacity-4 = 󰁾
ramp-capacity-5 = 󰁿
ramp-capacity-6 = 󰂀
ramp-capacity-7 = 󰂁
ramp-capacity-8 = 󰂂
ramp-capacity-9 = 󰁹

animation-charging-0 = 󰢜
animation-charging-1 = 󰂆
animation-charging-2 = 󰂇
animation-charging-3 = 󰂈
animation-charging-4 = 󰢝
animation-charging-5 = 󰂉
animation-charging-6 = 󰢞
animation-charging-7 = 󰂊
animation-charging-8 = 󰂋
animation-charging-9 = 󰂄
animation-charging-framerate = 500

animation-low-0 = 󰂃
animation-low-1 = 󰁺
animation-low-framerate = 750

[module/date]
type = internal/date
interval = 30
date = %a %d %b
time = %H:%M
label = %{A1:~/.local/bin/gntech-bar-action calendar:}󰅐 %time%%{A}
label-foreground = ${colors.foreground}
[module/cpu-temp]
type = custom/script
exec = ~/.local/bin/gntech-cpu-temp
interval = 5
click-left = ~/.local/bin/gntech-bar-action temperature
[module/power]
type = custom/text
format = "󰐥"
format-foreground = ${colors.red}
format-padding = 1
click-left = ~/.local/bin/gntech-power-menu


[module/tray]
type = internal/tray
format-margin = 1
tray-spacing = 4px
tray-size = 65%

[module/screenshot]
type = custom/text
format = 󰄀
format-foreground = #00d9ff
format-padding = 0
click-left = ~/.local/bin/gntech-screenshot region
click-right = ~/.local/bin/gntech-screenshot full

[module/clipboard]
type = custom/text
format = 󰅌
format-foreground = #c792ea
format-padding = 0
click-left = ~/.local/bin/gntech-clipboard
click-right = ~/.local/bin/gntech-clipboard-clear
